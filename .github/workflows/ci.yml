name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - run: composer validate --strict

      - run: composer install --no-interaction --no-progress

      - run: composer phpcs

      - run: composer phpstan

      - run: composer phpunit

  # The jobs above install composer.lock, which has symfony/console 7. These test the other versions
  # composer.json allows.
  dependencies:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Lowest dependencies
            php: '8.3'
            update: composer update --prefer-lowest --prefer-stable --no-interaction --no-progress
          - name: Symfony 8
            php: '8.5'
            update: composer update --with symfony/console:^8.0 --with-all-dependencies --no-interaction --no-progress

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      # composer.json pins the platform to PHP 8.3.0 for the lock file; Symfony 8 needs PHP 8.4.
      - run: composer config --unset platform.php

      - run: ${{ matrix.update }}

      - run: composer show symfony/console

      - run: composer phpstan

      - run: composer phpunit
